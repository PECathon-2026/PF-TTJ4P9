<!doctype html><html><head><meta charset="utf-8"><title>Checkout – Blue Kettle Store</title><style>body{font:15px system-ui;margin:24px;max-width:760px}label{display:block;margin:8px 0 2px}input,select,textarea{padding:6px;width:320px}button{padding:8px 14px;margin:8px 8px 0 0}.tile{display:inline-block;width:180px;height:110px;background:#223;margin:6px;color:#fff;position:relative}.participant-name{position:absolute;bottom:4px;left:6px}.msg{border:1px solid #ccc;padding:6px;margin:6px 0}</style></head><body>
<h1>Checkout</h1><h2>Order summary</h2><p>Order #BK-20931: Cast-iron kettle (1) – ₹2,499.00. Shipping ₹99.00. Total ₹2,598.00.</p>
<form action="/api/pay"><h2>Delivery</h2>
<label for="n">Full name</label><input id="n" name="fullname" autocomplete="name" value="Rohan Iyer">
<label for="e">Email address</label><input id="e" name="email" type="email" value="rohan989@example.com">
<label for="p">Mobile number</label><input id="p" name="phone" type="tel" value="">
<label for="a">Street address</label><input id="a" name="address" autocomplete="street-address" value="14, Lake View Road, Jodhpur">
<label for="z">PIN code</label><input id="z" name="pin" value="">
<h2>Payment</h2>
<label for="c">Card number</label><input id="c" name="cardnum" autocomplete="cc-number" value="">
<label for="x">Expiry (MM/YY)</label><input id="x" name="exp" autocomplete="cc-exp" value="">
<label for="v">CVV</label><input id="v" name="cvv" autocomplete="cc-csc" value="">
<p>Saved card on file: 5555 5555 5555 4444 (expires 09/29). Confirmation will be sent to meera421@example.com and +91 62082 35403.</p>
<button type="button">Apply coupon</button><button type="submit">Place order</button></form><script>document.querySelectorAll('form').forEach(f=>f.addEventListener('submit',e=>{e.preventDefault();document.body.dataset.submitted='1';document.body.dataset.form=JSON.stringify([...new FormData(f).entries()]);}));</script></body></html>
