<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        border: none;
        outline: none;
        border-radius: 12px;
        background: linear-gradient(135deg, #1b261a, #0d130e);
      }
    </style>
  </head>
  <body>
    <!-- Mystic Meadows Companion Sidebar Extension -->
    <div
      class="mm-extension-container"
      style="
        font-family: &quot;Segoe UI&quot;, system-ui, sans-serif;
        background: linear-gradient(135deg, #1b261a, #0d130e);
        color: #e2ecd9;
        width: 320px;
        border-radius: 12px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        overflow: hidden;
      "
    >
      <!-- Header / Brand Section -->
      <div
        class="mm-header"
        style="
          background: url(&quot;meadow-blur.jpg&quot;) center/cover;
          padding: 20px;
          border-bottom: 2px solid #4a6745;
          position: relative;
        "
      >
        <div
          style="
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(13, 19, 14, 0.6);
            z-index: 1;
          "
        ></div>
        <div
          style="
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 12px;
          "
        >
          <div
            class="logo-icon"
            style="
              width: 40px;
              height: 40px;
              background: #60a561;
              border-radius: 50%;
              display: flex;
              align-items: center;
              justify-content: center;
              box-shadow: 0 0 10px rgba(96, 165, 97, 0.5);
            "
          >
            🌿
          </div>
          <div>
            <h3
              style="
                margin: 0;
                font-size: 1.1rem;
                letter-spacing: 0.5px;
                color: #a3e6a6;
              "
            >
              Mystic Meadows
            </h3>
            <span style="font-size: 0.75rem; color: #8fa88c"
              >v2.4 Extension Profile</span
            >
          </div>
        </div>
      </div>

      <!-- Real-Time Metrics / Status Tiles -->
      <div
        class="mm-status-grid"
        style="
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 8px;
          padding: 12px;
        "
      >
        <div
          style="
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
          "
        >
          <div
            style="font-size: 0.7rem; color: #8fa88c; text-transform: uppercase"
          >
            Active Shaders
          </div>
          <div
            style="
              font-size: 0.95rem;
              font-weight: bold;
              color: #fff;
              margin-top: 4px;
            "
          >
            Complementary
          </div>
        </div>
        <div
          style="
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
          "
        >
          <div
            style="font-size: 0.7rem; color: #8fa88c; text-transform: uppercase"
          >
            Farming Yield
          </div>
          <div
            style="
              font-size: 0.95rem;
              font-weight: bold;
              color: #ffd166;
              margin-top: 4px;
            "
          >
            +18% Delight
          </div>
        </div>
      </div>

      <!-- Extension Functional Toggles -->
      <div
        class="mm-menu"
        style="
          padding: 0 12px 12px 12px;
          display: flex;
          flex-direction: column;
          gap: 8px;
        "
      >
        <!-- Macro & Scripts Integration (inspired by custom UI setups) -->
        <div
          class="menu-item"
          style="
            background: rgba(96, 165, 97, 0.08);
            border: 1px solid #3c5438;
            padding: 12px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
          "
        >
          <div style="display: flex; align-items: center; gap: 10px">
            <span>📜</span>
            <span style="font-size: 0.85rem; font-weight: 500"
              >Companion Keybinds</span
            >
          </div>
          <span
            style="
              font-size: 0.75rem;
              background: #3c5438;
              padding: 2px 6px;
              border-radius: 4px;
              color: #a3e6a6;
            "
            >Enabled</span
          >
        </div>

        <!-- Inventory / Storage Quick Look -->
        <div
          class="menu-item"
          style="
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 12px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
          "
        >
          <div style="display: flex; align-items: center; gap: 10px">
            <span>🎒</span>
            <span style="font-size: 0.85rem">Storage Monitor (JEI)</span>
          </div>
          <span style="font-size: 1.1rem; color: #8fa88c">›</span>
        </div>

        <!-- Photography / Exposure Mod Extension Gallery -->
        <div
          class="menu-item"
          style="
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 12px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
          "
        >
          <div style="display: flex; align-items: center; gap: 10px">
            <span>📸</span>
            <span style="font-size: 0.85rem">Exposure Photo Roll</span>
          </div>
          <span style="font-size: 0.75rem; color: #8fa88c">14 Captured</span>
        </div>
      </div>

      <!-- Bottom Interactive Action Button -->
      <div style="padding: 0 12px 16px 12px">
        <button
          style="
            width: 100%;
            padding: 10px;
            background: #4a6745;
            border: none;
            border-radius: 6px;
            color: #fff;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(74, 103, 69, 0.3);
            transition: background 0.2s;
          "
          onmouseover="this.style.background = '#5b7e55'"
          onmouseout="this.style.background = '#4a6745'"
        >
          Sync World State
        </button>
      </div>
    </div>
  </body>
</html>
